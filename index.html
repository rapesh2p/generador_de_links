<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Generator Pro</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0a0f;color:#fff;font-family:system-ui;padding:14px}.card{max-width:600px;margin:0 auto;background:#141422;border:1px solid #222;border-radius:16px;overflow:hidden}.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px}.tab{padding:7px 12px;border-radius:20px;background:#222;color:#999;border:0;font-size:11px;font-weight:800;cursor:pointer}.tab.active{background:#fff;color:#000}.form{padding:14px;display:grid;gap:8px}.form input{height:42px;background:#0f0f1a;border:1px solid #333;border-radius:10px;padding:0 12px;color:#fff;font-size:14px}.out{padding:14px;border-top:1px solid #222;display:grid;gap:10px}.linkRow{display:flex;gap:8px}.linkRow input{flex:1;height:42px;background:#000;border:1px solid #7c5cff;border-radius:10px;padding:0 12px;color:#7c5cff;font-family:monospace;font-size:11px}.btn{height:42px;padding:0 14px;border-radius:10px;border:0;font-weight:800;font-size:11px;cursor:pointer}.btn-w{background:#fff;color:#000;min-width:70px}.btn-g{background:#222;color:#fff}#qrImg{display:none;margin:10px auto;background:#fff;padding:8px;border-radius:10px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 20px;border-radius:99px;font-weight:800;font-size:12px;display:none;z-index:99}</style></head><body>
<div class="card"><div class="tabs" id="tabs"></div><div class="form" id="form"></div><div class="out"><div class="linkRow"><input id="result" readonly placeholder="Your link..."><button class="btn btn-w" id="copyBtn">COPY</button></div><div style="display:flex;gap:8px"><button class="btn btn-g" id="openBtn" style="flex:1">OPEN LINK</button><button class="btn btn-g" id="qrBtn" style="flex:1">QR CODE</button></div><img id="qrImg" width="160" height="160"></div></div><div id="toast">COPIED ✓</div>
<script>
const types={whatsapp:{label:'WhatsApp',fields:['phone','message'],make:d=>`https://wa.me/${d.phone.replace(/\D/g,'')}${d.message?'?text='+encodeURIComponent(d.message):''}`},telegram:{label:'Telegram',fields:['username'],make:d=>`https://t.me/${d.username.replace('@','')}`},email:{label:'Email',fields:['to','subject','body'],make:d=>{let q=[];if(d.subject)q.push('subject='+encodeURIComponent(d.subject));if(d.body)q.push('body='+encodeURIComponent(d.body));return `mailto:${d.to}${q.length?'?'+q.join('&'):''}`}},call:{label:'Call',fields:['phone'],make:d=>`tel:${d.phone}`},sms:{label:'SMS',fields:['phone','message'],make:d=>`sms:${d.phone}${d.message?'?body='+encodeURIComponent(d.message):''}`},maps:{label:'Maps',fields:['address'],make:d=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.address)}`},youtube:{label:'YouTube',fields:['url','seconds'],make:d=>d.url+(d.seconds?(d.url.includes('?')?'&':'?')+'t='+d.seconds+'s':'')},paypal:{label:'PayPal',fields:['username','amount'],make:d=>`https://paypal.me/${d.username}/${d.amount||''}`},insta:{label:'Instagram',fields:['username'],make:d=>`https://instagram.com/${d.username.replace('@','')}`},utm:{label:'UTM',fields:['url','source','medium','campaign'],make:d=>{if(!d.url)return'';let s=d.url.includes('?')?'&':'?';let p=[];if(d.source)p.push('utm_source='+d.source);if(d.medium)p.push('utm_medium='+d.medium);if(d.campaign)p.push('utm_campaign='+d.campaign);return p.length?d.url+s+p.join('&'):d.url}}};
let cur='whatsapp';
const tabsEl=document.getElementById('tabs'),formEl=document.getElementById('form'),resultEl=document.getElementById('result'),qrImg=document.getElementById('qrImg'),toast=document.getElementById('toast');
function showToast(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1500)}
function renderTabs(){tabsEl.innerHTML='';Object.keys(types).forEach(k=>{let b=document.createElement('button');b.className='tab'+(k===cur?' active':'');b.textContent=types[k].label;b.onclick=()=>{cur=k;renderTabs();renderForm()};tabsEl.appendChild(b)})}
function renderForm(){formEl.innerHTML='';types[cur].fields.forEach(f=>{let i=document.createElement('input');i.placeholder=f;i.id='f_'+f;i.oninput=gen;formEl.appendChild(i)});gen()}
function gen(){let d={};types[cur].fields.forEach(f=>{let e=document.getElementById('f_'+f);if(e)d[f]=e.value.trim()});let first=Object.values(d)[0];if(!first){resultEl.value='';return}try{resultEl.value=types[cur].make(d)}catch{resultEl.value=''};qrImg.style.display='none'}
renderTabs();renderForm();

// FIXED COPY - works in WhatsApp browser
function copyFixed(text){
  let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,99999);
  try{document.execCommand('copy');showToast('COPIED ✓');}catch(e){resultEl.select();showToast('Select & Copy manually');}
  document.body.removeChild(ta);
}
document.getElementById('copyBtn').onclick=()=>{if(!resultEl.value){showToast('Enter data first');return}copyFixed(resultEl.value)};
document.getElementById('openBtn').onclick=()=>{if(resultEl.value)window.open(resultEl.value,'_blank')};
document.getElementById('qrBtn').onclick=()=>{if(!resultEl.value)return;qrImg.src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(resultEl.value);qrImg.style.display=qrImg.style.display==='block'?'none':'block'};
</script></body></html>
